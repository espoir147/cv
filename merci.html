<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Message envoyé - ESPOH</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        :root{
            --bg:#050810;
            --panel: rgba(255,255,255,0.045);
            --panel-border: rgba(255,255,255,0.09);
            --ink:#F3F6FA;
            --dim:#8FA0BE;
            --blue:#3B8CFF;
            --green:#2FE0A6;
        }
        *{box-sizing:border-box; margin:0; padding:0;}
        html,body{height:100%;}
        body{
            font-family:'IBM Plex Sans', sans-serif;
            background-color:var(--bg);
            color:var(--ink);
            min-height:100vh;
            display:flex;
            align-items:center;
            justify-content:center;
            position:relative;
            overflow-x:hidden;
        }
        canvas#net-bg{position:fixed; inset:0; z-index:0; display:block;}
        .glow-blob{position:fixed; border-radius:50%; filter:blur(100px); z-index:0; pointer-events:none; animation:drift 20s ease-in-out infinite;}
        .glow-blob.b1{width:520px; height:520px; background:rgba(59,140,255,0.18); top:-160px; left:-120px;}
        .glow-blob.b2{width:460px; height:460px; background:rgba(47,224,166,0.14); bottom:-160px; right:-100px; animation-delay:-9s;}
        @keyframes drift{0%,100%{transform:translate(0,0) scale(1);} 50%{transform:translate(40px,-30px) scale(1.08);}}

        .container{
            max-width:560px;
            margin:20px;
            position:relative;
            z-index:2;
        }

        .thankyou-card{
            background:var(--panel);
            backdrop-filter:blur(18px);
            -webkit-backdrop-filter:blur(18px);
            border:1px solid var(--panel-border);
            border-radius:20px;
            padding:56px 44px;
            text-align:center;
            box-shadow:0 24px 70px rgba(0,0,0,.4);
            animation:fadeInUp .8s ease;
        }
        @keyframes fadeInUp{from{opacity:0; transform:translateY(30px);} to{opacity:1; transform:translateY(0);}}

        .checkmark{
            width:96px; height:96px; margin:0 auto 30px;
            background:linear-gradient(135deg,var(--blue),var(--green));
            border-radius:50%;
            display:flex; align-items:center; justify-content:center;
            font-size:2.6rem; color:#04070c;
            box-shadow:0 0 40px rgba(47,180,224,.35);
            animation:scaleIn .5s ease .3s both;
        }
        @keyframes scaleIn{from{transform:scale(0);} to{transform:scale(1);}}

        h1{
            font-family:'Space Grotesk', sans-serif;
            font-weight:700;
            font-size:2.2rem;
            margin-bottom:14px;
            color:var(--ink);
        }
        .thankyou-message{
            font-family:'IBM Plex Mono', monospace;
            font-size:1rem;
            color:var(--green);
            margin-bottom:10px;
        }
        .divider{
            width:70px; height:2px;
            background:linear-gradient(90deg,var(--blue),var(--green));
            margin:26px auto;
            border-radius:2px;
        }
        .info-text{
            color:var(--dim);
            line-height:1.8;
            margin-bottom:26px;
            font-size:.98rem;
        }
        .response-time{
            font-family:'IBM Plex Mono', monospace;
            background:rgba(47,224,166,0.08);
            border:1px solid rgba(47,224,166,0.3);
            border-radius:50px;
            padding:11px 24px;
            display:inline-block;
            margin-bottom:34px;
            color:var(--dim);
            font-size:.85rem;
        }
        .response-time i{margin-right:10px; color:var(--green);}

        .btn-back{
            display:inline-block;
            padding:15px 38px;
            background:linear-gradient(90deg,var(--blue),var(--green));
            color:#04070c;
            text-decoration:none;
            border-radius:50px;
            font-weight:700;
            letter-spacing:.3px;
            font-size:.92rem;
            transition:all .3s ease;
            box-shadow:0 10px 30px rgba(47,180,224,.28);
        }
        .btn-back:hover{transform:translateY(-3px); box-shadow:0 14px 40px rgba(47,180,224,.4);}
        .btn-back i{margin-left:8px;}

        .auto-redirect{
            margin-top:26px;
            color:var(--dim);
            font-family:'IBM Plex Mono', monospace;
            font-size:.82rem;
        }
        .auto-redirect i{color:var(--green); margin:0 5px;}

        .social-links{
            margin-top:40px;
            display:flex;
            justify-content:center;
            gap:14px;
        }
        .social-link{
            width:44px; height:44px;
            background:rgba(255,255,255,0.04);
            border:1px solid var(--panel-border);
            border-radius:50%;
            display:flex; align-items:center; justify-content:center;
            color:var(--dim);
            transition:all .3s ease;
            font-size:1.05rem;
            text-decoration:none;
        }
        .social-link:hover{
            background:linear-gradient(135deg,var(--blue),var(--green));
            color:#04070c;
            border-color:transparent;
            transform:translateY(-5px);
        }

        .logo{
            font-family:'Space Grotesk', sans-serif;
            font-size:1.4rem;
            font-weight:700;
            letter-spacing:.02em;
            margin-bottom:32px;
            display:block;
        }
        .logo span{
            background:linear-gradient(90deg,var(--blue),var(--green));
            -webkit-background-clip:text; background-clip:text; color:transparent;
        }
    </style>
</head>
<body>
    <canvas id="net-bg"></canvas>
    <div class="glow-blob b1"></div>
    <div class="glow-blob b2"></div>

    <div class="container">
        <div class="thankyou-card">
            <span class="logo">ESP<span>OH</span></span>

            <div class="checkmark">
                <i class="fas fa-check"></i>
            </div>

            <h1>Message envoyé !</h1>
            <p class="thankyou-message">// merci de m'avoir contacté</p>

            <div class="divider"></div>

            <p class="info-text">
                J'ai bien reçu votre message et je l'ai pris en compte.<br>
                Je vous répondrai dans les plus brefs délais.
            </p>

            <div class="response-time">
                <i class="fas fa-clock"></i> Délai de réponse : 24h – 48h
            </div>

            <br><br>

            <a href="index.html" class="btn-back">
                Retour à l'accueil <i class="fas fa-arrow-right"></i>
            </a>

            <div class="auto-redirect">
                <i class="fas fa-redo-alt"></i> Redirection automatique dans <span id="countdown">10</span> secondes...
            </div>

            <div class="social-links">
                <a href="https://github.com/espoir147" class="social-link"><i class="fab fa-github"></i></a>
                <a href="https://www.linkedin.com/in/espoir-sehoun-55021a36b" class="social-link"><i class="fab fa-linkedin-in"></i></a>
                <a href="https://x.com/takagi147" class="social-link"><i class="fab fa-twitter"></i></a>
                <a href="https://instagram.com/espoir_sehoun" class="social-link"><i class="fab fa-instagram"></i></a>
            </div>
        </div>
    </div>

    <script>
        // Countdown redirect
        let seconds = 10;
        const countdownEl = document.getElementById('countdown');
        let interval = setInterval(() => {
            seconds--;
            if (countdownEl) countdownEl.textContent = seconds;
            if (seconds <= 0) {
                clearInterval(interval);
                window.location.href = 'index.html';
            }
        }, 1000);

        const btnBack = document.querySelector('.btn-back');
        btnBack.addEventListener('mouseenter', () => clearInterval(interval));
        btnBack.addEventListener('mouseleave', () => {
            interval = setInterval(() => {
                seconds--;
                if (countdownEl) countdownEl.textContent = seconds;
                if (seconds <= 0) {
                    clearInterval(interval);
                    window.location.href = 'index.html';
                }
            }, 1000);
        });

        // Animated network background (same as index.html)
        const canvas = document.getElementById('net-bg');
        if (canvas) {
            const ctx = canvas.getContext('2d');
            let w, h, particles;

            function resize() {
                w = canvas.width = window.innerWidth;
                h = canvas.height = window.innerHeight;
            }
            window.addEventListener('resize', resize);
            resize();

            const COUNT = Math.min(60, Math.floor((w * h) / 22000));
            particles = Array.from({ length: COUNT }, () => ({
                x: Math.random() * w,
                y: Math.random() * h,
                vx: (Math.random() - 0.5) * 0.3,
                vy: (Math.random() - 0.5) * 0.3,
                c: Math.random() > 0.5 ? '59,140,255' : '47,224,166'
            }));

            function tick() {
                ctx.clearRect(0, 0, w, h);
                for (const p of particles) {
                    p.x += p.vx; p.y += p.vy;
                    if (p.x < 0 || p.x > w) p.vx *= -1;
                    if (p.y < 0 || p.y > h) p.vy *= -1;
                }
                for (let i = 0; i < particles.length; i++) {
                    for (let j = i + 1; j < particles.length; j++) {
                        const a = particles[i], b = particles[j];
                        const dx = a.x - b.x, dy = a.y - b.y;
                        const dist = Math.sqrt(dx * dx + dy * dy);
                        if (dist < 150) {
                            ctx.strokeStyle = `rgba(140,170,210,${0.12 * (1 - dist / 150)})`;
                            ctx.lineWidth = 1;
                            ctx.beginPath();
                            ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y);
                            ctx.stroke();
                        }
                    }
                }
                for (const p of particles) {
                    ctx.beginPath();
                    ctx.arc(p.x, p.y, 1.6, 0, Math.PI * 2);
                    ctx.fillStyle = `rgba(${p.c},0.85)`;
                    ctx.shadowBlur = 6;
                    ctx.shadowColor = `rgba(${p.c},0.7)`;
                    ctx.fill();
                }
                requestAnimationFrame(tick);
            }
            tick();
        }
    </script>
</body>
</html>
